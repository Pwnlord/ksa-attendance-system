name: Fallback zero-cost background jobs

on:
  schedule:
    # Supabase Cron is the primary scheduler. Keep this hourly fallback away
    # from the top of the hour to reduce GitHub schedule contention.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fallback wake of the API and due-job processing
        env:
          JOB_RUNNER_URL: ${{ secrets.JOB_RUNNER_URL }}
          JOB_RUNNER_SECRET: ${{ secrets.JOB_RUNNER_SECRET }}
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 5
          --max-time 45
          --request POST
          -H "x-job-runner-secret: ${JOB_RUNNER_SECRET}"
          "${JOB_RUNNER_URL}"
