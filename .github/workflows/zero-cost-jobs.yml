name: Run zero-cost background jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and process due jobs
        env:
          JOB_RUNNER_URL: ${{ secrets.JOB_RUNNER_URL }}
          JOB_RUNNER_SECRET: ${{ secrets.JOB_RUNNER_SECRET }}
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 5
          --max-time 45
          --request POST
          -H "x-job-runner-secret: ${JOB_RUNNER_SECRET}"
          "${JOB_RUNNER_URL}"
