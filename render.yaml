# Zero-cost deployment profile for the KSA Attendance System.
#
# This Blueprint intentionally creates only Free Render web services. PostgreSQL
# and private photo storage are supplied by the project's Supabase Free project.
# There is no Render database, paid service, or Render background worker here.
# Do not add a paid resource to this file without an explicit superseding decision.

previews:
  generation: off

services:
  - type: web
    name: ksa-attendance-staging-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DEPLOYMENT_PROFILE
        value: zero-cost
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: TRUSTED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JOB_RUNNER_MODE
        value: endpoint
      - key: JOB_RUNNER_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: EMAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_DRIVER
        value: google
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: ksa-attendance-staging-frontend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /login
    envVars:
      - key: BACKEND_PUBLIC_URL
        sync: false
