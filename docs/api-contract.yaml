      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, currentPassword]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                currentPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "204":
          description: Administrator role revoked
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/config:
    get:
      tags: [Administration]
      summary: Get protected course and venue configuration
      responses:
        "200":
          description: Protected configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseConfigEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
    patch:
      tags: [Administration]
      summary: Update protected configuration with audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseConfigUpdateRequest"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseConfigEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/audit-events:
    get:
      tags: [Administration]
      summary: Query sanitized append-oriented audit events
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: targetId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /admin/attendance/corrections:
    post:
      tags: [Administration]
      summary: Apply a reasoned historical attendance correction with before/after audit
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCorrectionRequest"
      responses:
        "200":
          description: Corrected authoritative attendance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrectionEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /internal/jobs/run:
    post:
      tags: [Operations]
      summary: Process one bounded batch of due background jobs for the zero-cost deployment
      description: This endpoint is disabled unless JOB_RUNNER_MODE is endpoint. It is called by the free scheduler and must never be exposed to a browser client.
      security:
        - jobRunnerSecret: []
      parameters:
        - name: x-job-runner-secret
          in: header
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Bounded batch processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationError"

  /admin/jobs/run:
    post:
      tags: [Operations]
      summary: Manually process one bounded batch of due background jobs
      responses:
        "200":
          description: Bounded batch processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /admin/sheets/health:
    get:
      tags: [Operations]
      summary: Return sanitized Google Sheets projection health and backlog
      responses:
        "200":
          description: Sync health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetSyncHealthEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /admin/sheets/retry:
    post:
      tags: [Operations]
      summary: Retry selected or failed projection jobs safely
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jobIds:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        "202":
          description: Retry accepted
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /admin/sheets/reconcile:
    post:
      tags: [Operations]
      summary: Rebuild the Sheet projection from authoritative database records
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: string
                  enum: [MASTER_REGISTER, SESSION, SUMMARY, FULL]
                sessionId:
                  type: [string, "null"]
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        "202":
          description: Durable reconciliation accepted
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ksa_session
      description: Secure, HttpOnly, host-only, SameSite=Lax server session; raw value is never stored. Idle expiry is 30 days and absolute expiry is 90 days.
    jobRunnerSecret:
      type: apiKey
      in: header
      name: x-job-runner-secret
      description: Backend-only secret for the zero-cost scheduled job endpoint. Never place it in browser code.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RosterEntryId:
      name: rosterEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationError:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthorizationError:
      description: Current actor is not allowed to perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Resource is absent or intentionally undisclosed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Current domain state conflicts with the requested command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimitedError:
      description: Too many requests; retry according to safe response guidance
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnavailableError:
      description: Authoritative service unavailable before a valid commit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Role:
      type: string
      enum: [PARTICIPANT, COURSE_REP, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    User:
      type: object
      required:
        [id, fullName, email, emailVerifiedAt, roles, status, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: [string, "null"]
          description: Normalized and unique for participant accounts
        email:
          type: string
          format: email
        serialNumber:
          type: [string, "null"]
          pattern: "^KSA-[0-9]{2}$"
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
        registeredAt:
          type: string
          format: date-time

    RosterEntryStatus:
      type: string
      enum: [UNCLAIMED, CLAIMED, DISABLED]

    RosterEntry:
      type: object
      required:
        [
          id,
          serialNumber,
          fullName,
          enrollmentEffectiveDate,
          status,
          version,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        serialNumber:
          type: string
          pattern: "^KSA-[0-9]{2}$"
        fullName:
          type: string
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
        enrollmentEffectiveDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/RosterEntryStatus"
        claimedByUserId:
          type: [string, "null"]
          format: uuid
        claimedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    RosterEntryUpdateRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
        enrollmentEffectiveDate:
          type: string
          format: date
        status:
          type: string
          enum: [UNCLAIMED, CLAIMED, DISABLED]
          description: Restore must preserve prior claim ownership; a claimed entry cannot be silently unclaimed and disputes use an explicit Admin process.
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      additionalProperties: false

    RosterImportResult:
      type: object
      required: [importId, createdCount, updatedCount, skippedCount]
      properties:
        importId:
          type: string
          format: uuid
        createdCount:
          type: integer
          minimum: 0
        updatedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string

    ParticipantSummary:
      type: object
      required: [id, fullName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        serialNumber:
          type: [string, "null"]
          pattern: "^KSA-[0-9]{2}$"
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    ActorSummary:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string

    RegistrationRequest:
      type: object
      required:
        [fullName, phone, email, password, serialNumber, identificationPhoto]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
        serialNumber:
          type: string
          description: Required in every mode; it is trimmed, prefix-normalized, and validated as KSA-XX. PREAPPROVED_ROSTER additionally requires it to match an eligible unclaimed roster entry.
        identificationPhoto:
          type: string
          format: binary
          description: Maximum 8 MB; backend produces private JPEG quality 85 at maximum 1600 px longest edge with EXIF removed

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Normalized email or canonical KSA-XX serial number
        password:
          type: string
          format: password

    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
        currentPassword:
          type: string
          format: password
          description: Required by policy for security-significant changes
      additionalProperties: false

    SessionStatus:
      type: string
      enum: [DRAFT, SCHEDULED, OPEN, CLOSED, CANCELLED]

    AttendanceSession:
      type: object
      required:
        [
          id,
          attendanceDate,
          effectiveStart,
          originalEffectiveEnd,
          effectiveEnd,
          timezone,
          status,
          version,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        attendanceDate:
          type: string
          format: date
        effectiveStart:
          type: string
          format: date-time
        effectiveEnd:
          type: string
          format: date-time
        originalEffectiveEnd:
          type: string
          format: date-time
          description: Immutable baseline used for the Course Rep two-hour extension cap
        timezone:
          type: string
          example: Africa/Lagos
        status:
          $ref: "#/components/schemas/SessionStatus"
        version:
          type: integer
          minimum: 1
        openedAt:
          type: [string, "null"]
          format: date-time
        openedBy:
          type: [string, "null"]
        closedAt:
          type: [string, "null"]
          format: date-time
        closedBy:
          type: [string, "null"]
          description: User ID or SYSTEM marker
        cancelledAt:
          type: [string, "null"]
          format: date-time
        extendedAt:
          type: [string, "null"]
          format: date-time
        extendedBy:
          type: [string, "null"]
        reopenedAt:
          type: [string, "null"]
          format: date-time
        reopenCount:
          type: integer
          minimum: 0
        presentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      required: [attendanceDate, effectiveStart, initialStatus]
      properties:
        attendanceDate:
          type: string
          format: date
        effectiveStart:
          type: string
          format: date-time
        effectiveEnd:
          type: string
          format: date-time
          description: Optional; defaults to three hours after effectiveStart
        initialStatus:
          type: string
          enum: [DRAFT, SCHEDULED, OPEN]

    ExtendSessionRequest:
      type: object
      required: [expectedVersion, effectiveEnd, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        effectiveEnd:
          type: string
          format: date-time
          description: Must be future and same local day; Course Rep maximum is two hours beyond originalEffectiveEnd
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    VersionedCommand:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1

    ReasonedVersionedCommand:
      allOf:
        - $ref: "#/components/schemas/VersionedCommand"
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 3
              maxLength: 1000

    LocationReading:
      type: object
      required: [latitude, longitude, accuracyMetres, capturedAt]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMetres:
          type: number
          exclusiveMinimum: 0
        capturedAt:
          type: string
          format: date-time
          description: Fixes older than 30 seconds are discarded. Coordinates are used in-request only and are never persisted.

    CheckInRequest:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/LocationReading"
        locationFailure:
          type: string
          enum: [PERMISSION_DENIED, TIMEOUT, UNAVAILABLE, UNSUPPORTED]
      oneOf:
        - required: [location]
        - required: [locationFailure]
      additionalProperties: false

    CheckInOutcome:
      type: string
      enum:
        - ATTENDANCE_RECORDED
        - ALREADY_CHECKED_IN
        - SESSION_NOT_OPEN
        - SESSION_CLOSED
        - DEVICE_CHANGE_REQUIRED
        - LOCATION_UNCERTAIN
        - LOCATION_PERMISSION_DENIED
        - LOCATION_TIMEOUT
        - LOCATION_UNAVAILABLE
        - LOCATION_UNSUPPORTED
        - CLEARLY_REMOTE

    CheckInResult:
      type: object
      required: [outcome, serverTime, manualRequestAllowed]
      properties:
        outcome:
          $ref: "#/components/schemas/CheckInOutcome"
        serverTime:
          type: string
          format: date-time
        attemptId:
          type: [string, "null"]
          format: uuid
          description: Safe reference used for an explicit manual-verification request when allowed
        manualRequestAllowed:
          type: boolean
          description: True only for a location outcome eligible for explicit manual review
        attendanceRecord:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"
        manualVerificationCase:
          oneOf:
            - $ref: "#/components/schemas/ManualVerificationCase"
            - type: "null"
        deviceChangeRequest:
          oneOf:
            - $ref: "#/components/schemas/DeviceChangeRequest"
            - type: "null"

    AttendanceMethod:
      type: string
      enum: [QR, MANUAL]

    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, NOT_APPLICABLE]

    AttendanceRecord:
      type: object
      required: [id, sessionId, participant, status, method, checkedInAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        status:
          type: string
          enum: [PRESENT]
        method:
          $ref: "#/components/schemas/AttendanceMethod"
        checkedInAt:
          type: string
          format: date-time
        approvedBy:
          oneOf:
            - $ref: "#/components/schemas/ActorSummary"
            - type: "null"
        locationStatus:
          type: string
          enum: [VERIFIED, MANUAL, NOT_RETAINED]

    AttendanceHistoryEntry:
      type: object
      required: [sessionId, attendanceDate, sessionStatus, attendanceStatus]
      properties:
        sessionId:
          type: string
          format: uuid
        attendanceDate:
          type: string
          format: date
        sessionStatus:
          $ref: "#/components/schemas/SessionStatus"
        attendanceStatus:
          $ref: "#/components/schemas/AttendanceStatus"
        record:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"

    AttendanceContext:
      type: object
      required: [state, deviceStatus, locationAcquisitionTimeoutSeconds]
      properties:
        state:
          type: string
          enum: [NOT_OPEN, OPEN, CLOSED, ALREADY_PRESENT]
        session:
          oneOf:
            - $ref: "#/components/schemas/AttendanceSession"
            - type: "null"
        attendanceRecord:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"
        deviceStatus:
          type: string
          enum: [REGISTERED_BROWSER, UNRECOGNIZED_BROWSER, NO_ACTIVE_DEVICE]
        locationAcquisitionTimeoutSeconds:
          type: integer
          minimum: 1
          description: Browser GPS acquisition timeout for each attempt; the client retries once after a timeout.

    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, EXPIRED, SUPERSEDED]

    ManualVerificationCase:
      type: object
      required:
        [
          id,
          participant,
          sessionId,
          creationSource,
          reasonCode,
          status,
          requestedAt,
          expiresAt,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        sessionId:
          type: string
          format: uuid
        sourceAttemptId:
          type: [string, "null"]
          format: uuid
        creationSource:
          type: string
          enum: [AUTOMATIC_UNCERTAIN, PARTICIPANT_REQUEST, OPERATOR_EMERGENCY]
        reasonCode:
          type: string
          enum:
            [
              LOCATION_UNCERTAIN,
              LOCATION_PERMISSION_DENIED,
              LOCATION_TIMEOUT,
              LOCATION_UNAVAILABLE,
              LOCATION_UNSUPPORTED,
              CLEARLY_REMOTE,
              EMERGENCY,
            ]
        participantReason:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ReviewStatus"
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Session close plus 15 minutes
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedBy:
          type: [string, "null"]
          format: uuid
        decisionReason:
          type: [string, "null"]
        photoAccessUrl:
          type: [string, "null"]
          description: Authorized presigned URL lasting only a few minutes; detail response only
        attendanceRecord:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"
        version:
          type: integer
          minimum: 1

    ReviewDecisionRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    DeviceChangeRequest:
      type: object
      required: [id, participant, status, requestedAt, version]
      properties:
        id:
          type: string
          format: uuid
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        requestedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedBy:
          type: [string, "null"]
          format: uuid
        decisionReason:
          type: [string, "null"]
        photoAccessUrl:
          type: [string, "null"]
          description: Authorized short-lived or proxied URL; detail response only
        version:
          type: integer
          minimum: 1

    PhotoChangeRequest:
      type: object
      required: [id, participant, status, requestedAt, version]
      properties:
        id:
          type: string
          format: uuid
        participant:
          $ref: "#/components/schemas/ParticipantSummary"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        note:
          type: [string, "null"]
        requestedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedBy:
          type: [string, "null"]
          format: uuid
        decisionReason:
          type: [string, "null"]
        currentPhotoAccessUrl:
          type: [string, "null"]
          description: Admin detail only; presigned for a few minutes
        candidatePhotoAccessUrl:
          type: [string, "null"]
          description: Admin detail only; presigned for a few minutes
        version:
          type: integer
          minimum: 1

    RateLimitConfig:
      type: object
      required:
        [
          failedLoginPerAccountIpPer15Minutes,
          passwordResetPerEmailPerHour,
          registrationPerIpPerHour,
          registrationPerIdentityPerHour,
          attendancePerAccountPerMinute,
          privilegedAdminPerMinute,
        ]
      properties:
        failedLoginPerAccountIpPer15Minutes:
          type: integer
          minimum: 1
          example: 5
        passwordResetPerEmailPerHour:
          type: integer
          minimum: 1
          example: 3
        registrationPerIpPerHour:
          type: integer
          minimum: 1
          example: 50
        registrationPerIdentityPerHour:
          type: integer
          minimum: 1
          example: 5
          description: Applies independently to normalized email and canonical serial
        attendancePerAccountPerMinute:
          type: integer
          minimum: 1
          example: 10
        privilegedAdminPerMinute:
          type: integer
          minimum: 1
          example: 20
        onboardingOverrideExpiresAt:
          type: [string, "null"]
          format: date-time
          description: Optional audited, time-bounded registration-IP override

    CourseConfig:
      type: object
      required:
        [
          courseLabel,
          timezone,
          registrationMode,
          venueLatitude,
          venueLongitude,
          geofenceRadiusMetres,
          maxAutomaticAccuracyMetres,
          clearlyRemoteDistanceMetres,
          locationFreshnessSeconds,
          locationAcquisitionTimeoutSeconds,
          defaultSessionDurationMinutes,
          manualCaseGraceMinutes,
          photoRetentionDaysAfterCourse,
          rateLimits,
          version,
        ]
      properties:
        courseLabel:
          type: string
        timezone:
          type: string
          example: Africa/Lagos
        registrationMode:
          type: string
          enum: [OPEN_REGISTRATION, PREAPPROVED_ROSTER, PILOT_FIRST_CLAIM_ADMIN_REVIEW]
          description: OPEN_REGISTRATION allows anyone to register; PREAPPROVED_ROSTER requires an eligible roster match; the pilot exception requires explicit configuration and review of every claim.
        venueLatitude:
          type: number
          minimum: -90
          maximum: 90
        venueLongitude:
          type: number
          minimum: -180
          maximum: 180
        geofenceRadiusMetres:
          type: number
          exclusiveMinimum: 0
          example: 200
        maxAutomaticAccuracyMetres:
          type: number
          exclusiveMinimum: 0
          example: 150
        clearlyRemoteDistanceMetres:
          type: number
          exclusiveMinimum: 0
          example: 500
        locationFreshnessSeconds:
          type: integer
          minimum: 1
          example: 30
        locationAcquisitionTimeoutSeconds:
          type: integer
          minimum: 1
          example: 10
        defaultSessionDurationMinutes:
          type: integer
          minimum: 1
          example: 180
        manualCaseGraceMinutes:
          type: integer
          minimum: 0
          example: 15
        photoRetentionDaysAfterCourse:
          type: integer
          minimum: 0
          example: 90
        rateLimits:
          $ref: "#/components/schemas/RateLimitConfig"
        version:
          type: integer
          minimum: 1

    CourseConfigUpdateRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        courseLabel:
          type: string
        timezone:
          type: string
          example: Africa/Lagos
        registrationMode:
          type: string
          enum: [OPEN_REGISTRATION, PREAPPROVED_ROSTER, PILOT_FIRST_CLAIM_ADMIN_REVIEW]
        venueLatitude:
          type: number
          minimum: -90
          maximum: 90
        venueLongitude:
          type: number
          minimum: -180
          maximum: 180
        geofenceRadiusMetres:
          type: number
          exclusiveMinimum: 0
        maxAutomaticAccuracyMetres:
          type: number
          exclusiveMinimum: 0
        clearlyRemoteDistanceMetres:
          type: number
          exclusiveMinimum: 0
        locationFreshnessSeconds:
          type: integer
          minimum: 1
        locationAcquisitionTimeoutSeconds:
          type: integer
          minimum: 1
        defaultSessionDurationMinutes:
          type: integer
          minimum: 1
        manualCaseGraceMinutes:
          type: integer
          minimum: 0
        photoRetentionDaysAfterCourse:
          type: integer
          minimum: 0
        rateLimits:
          $ref: "#/components/schemas/RateLimitConfig"
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      additionalProperties: false

    AttendanceCorrectionRequest:
      type: object
      required: [sessionId, participantId, targetStatus, reason]
      properties:
        sessionId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        targetStatus:
          type: string
          enum: [PRESENT, ABSENT, NOT_APPLICABLE]
        checkedInAt:
          type: [string, "null"]
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    AttendanceCorrection:
      type: object
      required:
        [
          sessionId,
          participantId,
          effectiveStatus,
          reason,
          correctedAt,
          correctedBy,
          auditEventId,
        ]
      properties:
        sessionId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        effectiveStatus:
          $ref: "#/components/schemas/AttendanceStatus"
        record:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"
        reason:
          type: string
        correctedAt:
          type: string
          format: date-time
        correctedBy:
          type: string
          format: uuid
        auditEventId:
          type: string
          format: uuid
          description: Append-oriented event containing the authoritative before/after history

    AuditEvent:
      type: object
      required: [id, action, targetType, targetId, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: [string, "null"]
          format: uuid
        actorRoles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        reason:
          type: [string, "null"]
        before:
          type: [object, "null"]
          additionalProperties: true
        after:
          type: [object, "null"]
          additionalProperties: true
        correlationId:
          type: [string, "null"]
        occurredAt:
          type: string
          format: date-time

    SheetSyncHealth:
      type: object
      required: [status, workerStatus, pendingCount, failedCount]
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE]
        workerStatus:
          type: string
          enum: [HEALTHY, STALE, UNAVAILABLE]
        pendingCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        lastSuccessfulSyncAt:
          type: [string, "null"]
          format: date-time
        lastSanitizedError:
          type: [string, "null"]
        provider:
          type: string
          enum: [memory, google]

    JobRunEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [claimed, succeeded, failed]
          properties:
            claimed:
              type: integer
              minimum: 0
            succeeded:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0

    DeviceStatus:
      type: object
      required: [browserStatus]
      properties:
        browserStatus:
          type: string
          enum: [REGISTERED_BROWSER, UNRECOGNIZED_BROWSER, NO_ACTIVE_DEVICE]
        activeDeviceApprovedAt:
          type: [string, "null"]
          format: date-time
        pendingRequest:
          oneOf:
            - $ref: "#/components/schemas/DeviceChangeRequest"
            - type: "null"

    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - AUTHENTICATION_REQUIRED
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - STALE_STATE
            - DUPLICATE_EMAIL
            - DUPLICATE_PHONE
            - DUPLICATE_SERIAL
            - ROSTER_ENTRY_NOT_ELIGIBLE
            - ROSTER_CLAIM_CONFLICT
            - LAST_ADMIN_REQUIRED
            - RECENT_REAUTHENTICATION_REQUIRED
            - SELF_APPROVAL_FORBIDDEN
            - SESSION_ALREADY_OPEN
            - SESSION_NOT_OPEN
            - SESSION_CLOSED
            - SESSION_EXTENSION_LIMIT
            - DEVICE_CHANGE_REQUIRED
            - BROWSER_ASSIGNED_TO_OTHER_ACCOUNT
            - LOCATION_UNCERTAIN
            - LOCATION_PERMISSION_DENIED
            - LOCATION_TIMEOUT
            - LOCATION_UNAVAILABLE
            - LOCATION_UNSUPPORTED
            - CLEARLY_REMOTE
            - MANUAL_VERIFICATION_NOT_ALLOWED
            - MANUAL_VERIFICATION_EXPIRED
            - PHOTO_TOO_LARGE
            - PHOTO_UNSUPPORTED
            - RATE_LIMITED
            - SERVICE_TEMPORARILY_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    AuthenticatedUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/User"
            attendanceDeviceStatus:
              type: [string, "null"]
              enum:
                [
                  REGISTERED_BROWSER,
                  UNRECOGNIZED_BROWSER,
                  NO_ACTIVE_DEVICE,
                  null,
                ]

    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AttendanceSession"

    AttendanceContextEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AttendanceContext"

    CheckInResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CheckInResult"

    AttendanceRecordEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AttendanceRecord"

    AttendanceCorrectionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AttendanceCorrection"

    ManualVerificationCaseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ManualVerificationCase"

    DeviceChangeRequestEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DeviceChangeRequest"

    PhotoChangeRequestEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PhotoChangeRequest"

    RosterEntryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RosterEntry"

    RosterImportResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RosterImportResult"

    DeviceStatusEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DeviceStatus"

    CourseConfigEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CourseConfig"

    SheetSyncHealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SheetSyncHealth"
