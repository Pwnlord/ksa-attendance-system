        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Approved or already-final request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoChangeRequestEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/photo-change-requests/{requestId}/reject:
    post:
      tags: [Identification photos]
      summary: Admin-only rejection of a candidate identification photo
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Rejected or already-final request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoChangeRequestEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/roles/course-representative:
    put:
