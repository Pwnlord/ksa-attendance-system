            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Admin-only photo-change queue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoChangeRequest"
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /admin/photo-change-requests/{requestId}:
    get:
