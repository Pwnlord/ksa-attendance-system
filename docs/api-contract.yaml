              properties:
                participantId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                currentPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Updated role assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/roles/admins:
    get:
      tags: [Administration]
      summary: List active Administrators
      responses:
        "200":
          description: Active Administrators
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/AuthorizationError"
    post:
      tags: [Administration]
      summary: Grant Administrator role after confirmation/recent re-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reason, currentPassword]
              properties:
                userId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                currentPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "201":
          description: Administrator role granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/roles/admins/{userId}/revoke:
