openapi: 3.1.0
info:
  title: KSA Attendance System API
  version: 0.2.0
  summary: September 2026 implementation baseline between the production frontend and backend.
  description: |
    This contract captures approved API capabilities and stable domain outcomes for
    implementation. Endpoint names may change through a documented superseding decision, but the
    authorization, state, privacy, idempotency, and source-of-truth guarantees must remain.

    The permanent QR points to a stable frontend route such as `/check-in`; it is not an
    API credential. The frontend obtains an explicit browser location and submits it to
    the backend, which makes the final attendance decision using server time.

    The production browser uses the same public origin for the UI and `/api/*`. Cookie-authenticated
    state changes also require the implementation's CSRF/origin control. Abuse-sensitive operations
    may return the documented `RATE_LIMITED` response and safe `Retry-After` under DEC-036.
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Auth
  - name: Me
  - name: Attendance
  - name: Devices
  - name: Sessions
  - name: Manual verification
  - name: Participants
  - name: Roster
  - name: Identification photos
  - name: Administration
  - name: Operations
security:
  - sessionCookie: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Match and claim an approved roster entry, register a participant, and bind this browser
      description: Queues email verification but does not require verification for attendance.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Participant registered, authenticated, and device bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate through the shared login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; roles come from server state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current authentication session without revoking attendance-device binding
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/AuthenticationError"

  /auth/session:
    get:
      tags: [Auth]
      summary: Return the current authenticated user, roles, and safe session context
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationError"

  /auth/email-verification/resend:
    post:
      tags: [Auth]
      summary: Queue another verification email for the current unverified user
      responses:
        "202":
          description: Verification request safely accepted
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      summary: Confirm ownership of the email address using a single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 16
      responses:
        "204":
          description: Email verified or token already consumed for the same account
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Begin password recovery without disclosing account existence unnecessarily
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Normalized email; a reset is sent only when it belongs to a verified account
      responses:
        "202":
          description: Recovery request accepted whether or not an account is disclosed
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Complete password reset; does not approve a new attendance device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "204":
          description: Password reset and affected sessions rotated/revoked according to policy
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /me:
    get:
      tags: [Me]
      summary: Get the current user's permitted profile
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationError"
    patch:
      tags: [Me]
      summary: Update permitted own profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /me/attendance:
    get:
      tags: [Me]
      summary: List the current participant's attendance history
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Own attendance history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceHistoryEntry"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /me/manual-verifications:
    get:
      tags: [Manual verification]
      summary: List the current participant's own manual-verification cases without photo access
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Own case status, including pending expiry and final attendance where available
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManualVerificationCase"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /me/device:
    get:
      tags: [Devices]
      summary: Return safe current-browser and registered attendance-device status
      responses:
        "200":
          description: Device status; raw credentials are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatusEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /me/device-change-requests:
    get:
      tags: [Devices]
      summary: List the current participant's own device-change requests
      responses:
        "200":
          description: Own requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceChangeRequest"
        "403":
          $ref: "#/components/responses/AuthorizationError"
    post:
      tags: [Devices]
      summary: Request approval for the current browser as a replacement attendance device
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Request created or current pending request returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChangeRequestEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /me/photo-change-requests:
    get:
      tags: [Identification photos]
      summary: List the current participant's identification-photo replacement requests
      responses:
        "200":
          description: Own photo-change requests without reusable storage credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoChangeRequest"
        "403":
          $ref: "#/components/responses/AuthorizationError"
    post:
      tags: [Identification photos]
      summary: Submit a private candidate identification photo for Admin-only approval
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [identificationPhoto]
              properties:
                identificationPhoto:
                  type: string
                  format: binary
                  description: Maximum 8 MB; processed to a maximum 1600 px JPEG at quality 85 with EXIF removed
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Candidate processed privately and request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoChangeRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /attendance/context:
    get:
      tags: [Attendance]
      summary: Return the current participant-safe attendance state for the stable check-in route
      responses:
        "200":
          description: Current attendance context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceContextEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationError"

  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Evaluate and, when valid, atomically record current participant attendance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: Deterministic attendance outcome, including duplicate success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResultEnvelope"
        "201":
          description: New attendance record committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResultEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          description: Session or attendance-device state prevents automatic check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResultEnvelope"
        "422":
          description: Location could not be automatically accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResultEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitedError"
        "503":
          $ref: "#/components/responses/UnavailableError"

  /sessions/current:
    get:
      tags: [Sessions]
      summary: Return current operational session state
      responses:
        "200":
          description: Current session or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/AttendanceSession"
                      - type: "null"
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /sessions:
    get:
      tags: [Sessions]
      summary: List session history
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
      responses:
        "200":
          description: Sessions visible to the current operational role
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceSession"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"
    post:
      tags: [Sessions]
      summary: Create a draft, scheduled, or immediately opened session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}:
    get:
      tags: [Sessions]
      summary: Get operational session detail
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /sessions/{sessionId}/open:
    post:
      tags: [Sessions]
      summary: Open a valid draft or scheduled session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommand"
      responses:
        "200":
          description: Open session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}/close:
    post:
      tags: [Sessions]
      summary: Close the current session early
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommand"
      responses:
        "200":
          description: Closed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}/extend:
    post:
      tags: [Sessions]
      summary: Extend an open session under the actor's limit and audit the original/new end
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSessionRequest"
      responses:
        "200":
          description: Open session with its updated effective end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}/cancel:
    post:
      tags: [Sessions]
      summary: Cancel with reason; Course Rep only before/while open, Admin also after close
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonedVersionedCommand"
      responses:
        "200":
          description: Cancelled session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}/reopen:
    post:
      tags: [Sessions]
      summary: Admin-only reopen of the same closed session with audit reason and new closing time
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReasonedVersionedCommand"
                - type: object
                  required: [effectiveEnd]
                  properties:
                    effectiveEnd:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Reopened session with unchanged identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /sessions/{sessionId}/attendance:
    get:
      tags: [Sessions]
      summary: List live or historical session attendance visible to operational roles
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Session attendance
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceRecord"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /manual-verification-requests:
    post:
      tags: [Manual verification]
      summary: Explicitly request review after a denied/unavailable/no-fix or clearly-remote location outcome
      description: Never creates a case for inactive/closed sessions, duplicate attendance, or an unrecognized device. Repeated requests return the existing pending case.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, reason]
              properties:
                attemptId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        "200":
          description: Existing pending case returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationCaseEnvelope"
        "201":
          description: Pending case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /manual-verifications:
    get:
      tags: [Manual verification]
      summary: List manual-verification cases visible to the current operator
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Manual cases with minimum list-view participant data
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManualVerificationCase"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /manual-verifications/{caseId}:
    get:
      tags: [Manual verification]
      summary: Get a review case including authorized short-lived/proxied photo access
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /manual-verifications/{caseId}/approve:
    post:
      tags: [Manual verification]
      summary: Approve a pending case and idempotently create manual attendance
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Approved case and attendance, including already-final result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /manual-verifications/{caseId}/reject:
    post:
      tags: [Manual verification]
      summary: Reject a pending manual-verification case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Rejected case or already-final result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /manual-verifications/emergency-attendance:
    post:
      tags: [Manual verification]
      summary: Create controlled emergency manual attendance during an eligible session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, sessionId, reason]
              properties:
                participantId:
                  type: string
                  format: uuid
                sessionId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        "201":
          description: Manual attendance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /device-change-requests:
    get:
      tags: [Devices]
      summary: List device-change requests visible to an operational reviewer
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceChangeRequest"
                  nextCursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/AuthorizationError"

  /device-change-requests/{requestId}:
    get:
      tags: [Devices]
      summary: Get an authorized device-change review including protected identity-photo access
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Device-change request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChangeRequestEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /device-change-requests/{requestId}/approve:
    post:
      tags: [Devices]
      summary: Approve candidate device and atomically revoke the previous active device
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Approved or already-final request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChangeRequestEnvelope"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /device-change-requests/{requestId}/reject:
