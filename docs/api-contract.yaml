              required: [file, reason]
              properties:
                file:
                  type: string
                  format: binary
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        "201":
          description: Import committed after whole-file validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportResultEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/roster/{rosterEntryId}:
